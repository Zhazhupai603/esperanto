[workspace]
resolver = "2"
members = [
    "crates/tidx",
    "crates/txmap",
    "crates/qc",
    "crates/pile",
    "crates/engine",
    "crates/bamio",
    "crates/map",
"crates/scan",
    "crates/score",
    "crates/flow",
    "crates/cli",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
blake3 = "1"
flate2 = { version = "1", features = ["zlib-ng"] }
rust-htslib = "0.49"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
memmap2 = "0.9"
bytemuck = "1"
noodles = { version = "0.101", features = ["bam", "sam", "bgzf"] }
noodles-bgzf = { version = "0.43", features = ["libdeflate"] }
ndarray = "0.16"
half = "2.4"
safetensors = "0.4"
faer = "0.24.4"

[profile.release]
lto = "thin"
codegen-units = 1
