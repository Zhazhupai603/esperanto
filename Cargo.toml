[workspace]
resolver = "2"
members = [
    "crates/tidx",
    "crates/txmap",
    "crates/qc",
    "crates/engine",
    "crates/bamio",
    "crates/map",
    "crates/score",
    "crates/report",
    "crates/flow",
    "crates/cli",
]

[workspace.package]
version = "1.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
blake3 = "1"
flate2 = { version = "1", features = ["zlib-ng"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
tar = "0.4"
crossterm = "0.29"
rust-htslib = "0.49"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
memmap2 = "0.9"
bytemuck = "1"
noodles = { version = "0.101", features = ["bam", "sam", "bgzf"] }
noodles-bgzf = { version = "0.43", features = ["libdeflate"] }

[profile.release]
lto = "thin"
codegen-units = 1
